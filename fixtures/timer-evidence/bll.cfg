# BLL layout preserving the pinned timer suite's source-derived CODE address.
MEMORY {
    ZP:       file = "", start = $0000, size = $0100;
    HEADER:   file = %O, start = $01F6, size = $000A;
    PAYLOAD:  file = %O, start = $0200, size = $6000;
    FB:       file = "", start = $6000, size = $1FE0;
    BSSRAM:   file = "", start = $8000, size = $4000;
}
SEGMENTS {
    ZEROPAGE:   load = ZP,      type = zp,  define = yes;
    BLL:        load = HEADER,  type = ro,  define = yes;
    STARTUP:    load = PAYLOAD, type = ro,  define = yes;
    LOWCODE:    load = PAYLOAD, type = ro,  define = yes, optional = yes;
    ONCE:       load = PAYLOAD, type = ro,  define = yes, optional = yes;
    CODE:       load = PAYLOAD, type = ro,  define = yes;
    RODATA:     load = PAYLOAD, type = ro,  define = yes, optional = yes;
    DATA:       load = PAYLOAD, type = rw,  define = yes, optional = yes;
    EXTENSION:  load = PAYLOAD, type = ro,  define = yes, start = $0500;
    FRAMEBUFFER: load = FB, type = bss, define = yes;
    BSS:        load = BSSRAM,  type = bss, define = yes;
}

