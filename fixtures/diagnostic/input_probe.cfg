# Project-owned BS93 linker layout. The BLL segment starts at $01F6 so its
# ten-byte container header is followed by tier-A payload at $0200.
MEMORY {
    BLLFILE:  file = %O, start = $01F6, size = $0100;
    RESULT:   file = "", start = $0400, size = $0008;
}
SEGMENTS {
    BLL:      load = BLLFILE, type = ro, define = yes;
    RESULT:   load = RESULT, type = bss;
}
